# Compila l'APK Android di prova a ogni push: GitHub → Actions → "APK Android (debug)" → Artifacts.
name: APK Android (debug)

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # l'Android SDK è già sul runner (ANDROID_HOME); Gradle scarica da solo la piattaforma che manca
      - name: Compila APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ashen-atlas-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
