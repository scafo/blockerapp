<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Radar · registro</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* Mockup della Sala Radar sul riferimento di Nico (riquadri smussati di luce sospesi nel buio, ognuno allungato in una scia
     a lunga esposizione verso il centro: pieni azzurri, a righe, a puntini, a griglia). Qui alcuni riquadri sono le foto del
     registro; col mouse ci si muove dentro e i riquadri vicini al puntatore si ingrandiscono (Apple Watch).
     In 3D vero (three.js, Nico 24 novembre 2026: "fai lo stesso con il radar"): ogni riquadro è un blocco smussato davanti alla
     camera e la sua scia è un fascio di linee, puntini o immagini che va indietro nello spazio; la prospettiva la porta al centro.
     Bagliore con il bloom, grana fissa sopra. */
  * { box-sizing: border-box; margin: 0; }
  body { background: #05080d; color: #e9ebe6; font-family: "Chakra Petch", sans-serif; width: 1440px; height: 900px; overflow: hidden; position: relative; }
  /* barra del gioco (src/ui/navBar.ts): fondo scuro pieno, filo sotto, Home, sezioni in Chakra Petch, scorte, Frammenti, profilo, audio */
  nav { position: absolute; top: 0; left: 0; right: 0; height: 64px; display: flex; align-items: center; padding: 0 24px; background: rgba(5,8,13,.94);
    border-bottom: 1px solid rgba(127,140,152,.28); z-index: 5; font-family: "Chakra Petch", sans-serif; }
  nav .ic { width: 22px; height: 22px; display: inline-block; background: var(--c, #b9c0c2); -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  nav .home { display: flex; align-items: center; gap: 8px; opacity: .8; font: 17px "Helvetica Neue", Helvetica, Arial, sans-serif; color: #e9ebe6; --c: #e9ebe6; }
  nav .sep { width: 1px; height: 32px; background: rgba(127,140,152,.35); margin: 0 48px 0 20px; }
  nav .tab { font-size: 16px; letter-spacing: 2.5px; color: #8a949a; margin-right: 40px; height: 64px; line-height: 64px; position: relative; }
  nav .tab.on { color: #e9ebe6; }
  nav .tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 2px; height: 3px; background: #fff; }
  nav .nright { margin-left: auto; display: flex; align-items: center; }
  nav .res { display: flex; align-items: center; gap: 10px; width: 112px; font-size: 18px; color: #e9ebe6; }
  nav .lume { display: flex; align-items: center; gap: 10px; width: 96px; font-size: 18px; color: #9fd0f5; --c: #9fd0f5; margin-left: 20px; }
  canvas, #grain { position: absolute; left: 0; top: 64px; }
  #grain { pointer-events: none; z-index: 2; }
  .card { position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); text-align: center; z-index: 3; pointer-events: none;
    font-family: "Share Tech Mono", monospace; font-size: 13px; line-height: 1.6; color: #7f888e; }
  .card h2 { font-family: "Chakra Petch"; font-size: 24px; font-weight: 600; color: #e9ebe6; }
</style>
</head>
<body>
<nav><span class="home"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/arrow-left.svg)"></i>Home</span><i class="sep"></i><span class="tab">GIOCA</span><span class="tab on">BASE</span><span class="tab">RICERCA</span><span class="tab">ARSENALE</span><span class="tab">MERCATO</span><span class="nright"><span class="res"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/cog.svg);--c:#a9bccb"></i>476</span><span class="res"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/fuel.svg);--c:#f2b84b"></i>109</span><span class="res"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/wheat.svg);--c:#9dbf6b"></i>141</span><span class="lume"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/sparkles.svg)"></i>120</span><span style="margin-left:20px"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/user-round.svg)"></i></span><span style="margin-left:22px"><i class="ic" style="--m:url(/node_modules/lucide-static/icons/volume-2.svg)"></i></span></span></nav>
<canvas id="c"></canvas>
<canvas id="grain" width="1440" height="836"></canvas>
<div class="card" id="card"></div>
<script type="module">
  import * as THREE from 'https://esm.sh/three@0.160.0';
  import { RoundedBoxGeometry } from 'https://esm.sh/three@0.160.0/examples/jsm/geometries/RoundedBoxGeometry.js';
  import { EffectComposer } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
  import { RenderPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js';
  import { OutputPass } from 'https://esm.sh/three@0.160.0/examples/jsm/postprocessing/OutputPass.js';
  const W = 1440, H = 836, card = document.getElementById('card');
  const R = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setSize(W, H);
  const scene0 = 0x05080d;
  const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
  scene.background = new THREE.Color(scene0); // fondo del gioco (come sfondo della scena: il colore passa giusto dal bloom)
  const composer = new EffectComposer(R); composer.addPass(new RenderPass(scene, cam));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.9, 0.25, 0.45)); composer.addPass(new OutputPass());

  // colori freddi del gioco: azzurro del Lume, bianco del testo, grigio ardesia (niente oro né arancio)
  const BLUE = 0x5c98e8, WARM = 0xe9ebe6, AMBER = 0xa9bccb, ICE = 0x9fd0f5;
  // riquadri come nel riferimento: posizione della faccia sullo schermo rispetto al centro (px), lato (px), tipo, colore, lunghezza
  // della scia (1 = nessuna). 'photo' = voce del registro: foto sulla faccia, la scia è la foto stessa che si allunga.
  const T = [
    [25, -250, 86, 'photo', BLUE, 1.15, ['fronts/front-1', 'Fronte I · campagna 3', 'VITTORIA · 142 PROVINCE']],
    [-200, -190, 80, 'lines', ICE, 2.2], [-390, -150, 130, 'dots', AMBER, 1.8], [190, -190, 80, 'grid', WARM, 1],
    [370, -200, 84, 'lines', WARM, 1.9], [540, -170, 84, 'lines', AMBER, 1.25], [660, -110, 120, 'lines', ICE, 2.6],
    [360, -60, 100, 'photo', WARM, 2.2, ['rooms/room-radar', 'Sala Radar', 'LIV 1/3 · VISTA +1']],
    [-190, -40, 70, 'dots', WARM, 2.4], [-400, 30, 110, 'lines', AMBER, 3.2], [-190, 50, 84, 'lines', ICE, 2.6],
    [-60, -60, 46, 'dots', WARM, 1.9], [80, 60, 60, 'dots', WARM, 2.2], [340, 60, 90, 'photo', ICE, 2.2, ['people/leader-imperium', 'Imperium', 'INCONTRATO 4 VOLTE · 2 GUERRE']],
    [640, 70, 120, 'dots', WARM, 2.6], [-350, 140, 100, 'lines', WARM, 2.4], [-200, 170, 100, 'photo', BLUE, 1.35, ['events/ev-nebbia', 'La nebbia viola', 'EVENTO RARO · VISTO 1 VOLTA']],
    [-20, 190, 80, 'dots', AMBER, 1.7], [170, 175, 70, 'photo', WARM, 2.0, ['fronts/front-3', 'Fronte III · campagna 9', 'RITIRATA AL MINUTO 12']],
    [180, 300, 86, 'photo', BLUE, 1.3, ['people/leader-cabal', 'Cabal', 'INCONTRATA 2 VOLTE · ALLEATA']],
    [370, 210, 100, 'lines', ICE, 1.9], [520, 160, 110, 'lines', AMBER, 1.8],
    [-560, -60, 90, 'photo', ICE, 1.6, ['events/ev-frequenza', 'Una frequenza', 'EVENTO · VISTO 3 VOLTE']],
    [-560, 250, 90, 'photo', WARM, 1.5, ['units/u-corazzati', 'Corazzati', 'PRIMO IMPIEGO: CAMPAGNA 6']],
    [560, 300, 86, 'photo', BLUE, 1.4, ['events/ev-convoglio', 'Convoglio', 'EVENTO · VISTO 5 VOLTE']],
  ];

  // da pixel dello schermo a spazio 3D sul piano delle facce (z = -Z0): così la composizione resta quella del riferimento
  const Z0 = 6, K = (2 * Math.tan(THREE.MathUtils.degToRad(25)) * Z0) / H;
  let redraw = true;
  const TL = new THREE.TextureLoader();
  const photo = (k) => { const t = TL.load(`../../src/assets/img/${k}.jpg`, () => (redraw = true)); t.colorSpace = THREE.SRGBColorSpace; return t; };
  // facce a righe, puntini e griglia: piccole texture disegnate una volta
  function faceTex(kind) {
    const S = 128, o = document.createElement('canvas'); o.width = o.height = S; const q = o.getContext('2d'); q.fillStyle = '#fff';
    if (kind === 'lines') { q.globalAlpha = 0.1; q.fillRect(0, 0, S, S); q.globalAlpha = 1; for (let y = 3; y < S; y += 7) q.fillRect(0, y, S, 3); }
    else if (kind === 'grid') for (let a = 0; a < 8; a++) for (let b = 0; b < 8; b++) { q.beginPath(); q.arc(10 + a * 15.4, 10 + b * 15.4, 2.6, 0, 7); q.fill(); }
    else if (kind === 'dots') for (let k = 0; k < 140; k++) { q.globalAlpha = 0.4 + 0.6 * Math.random(); q.beginPath(); q.arc(Math.random() * S, Math.random() * S, 1 + Math.random() * 2.4, 0, 7); q.fill(); }
    else { q.fillRect(0, 0, S, S); }
    const t = new THREE.CanvasTexture(o); t.colorSpace = THREE.SRGBColorSpace; return t;
  }
  const TEX = { lines: faceTex('lines'), grid: faceTex('grid'), dots: faceTex('dots') };
  const dotSprite = (() => { const o = document.createElement('canvas'); o.width = o.height = 32; const q = o.getContext('2d');
    const gr = q.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, '#fff'); gr.addColorStop(1, 'rgba(255,255,255,0)'); q.fillStyle = gr; q.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(o); })();
  const add = { blending: THREE.AdditiveBlending, transparent: true, depthWrite: false };

  const tiles = T.map(([px, py, ps, kind, col, len, reg]) => {
    const g = new THREE.Group(), s = ps * K, c = new THREE.Color(col);
    g.position.set(px * K, -py * K, -Z0); scene.add(g);
    const map = kind === 'photo' ? photo(reg[0]) : TEX[kind] ?? TEX.lines;
    // faccia davanti: blocco smussato vero
    const faceMat = kind === 'photo' ? new THREE.MeshBasicMaterial({ map, color: 0xffffff }) : new THREE.MeshBasicMaterial({ map, color: c.clone().multiplyScalar(0.7), ...add });
    const face = new THREE.Mesh(new RoundedBoxGeometry(s, s, s * 0.12, 3, s * 0.16), faceMat); g.add(face);
    const L = Z0 * (len - 1); // la scia va indietro nello spazio: in prospettiva converge al centro
    if (L > 0) {
      if (kind === 'lines' || kind === 'grid') { // fascio di righe: ogni riga della faccia diventa un filo di luce che si spegne
        const pos = [], cols = [];
        for (let y = -0.42; y <= 0.43; y += 0.12) for (let x = -0.4; x <= 0.41; x += 0.2) {
          pos.push(x * s, y * s, 0, x * s, y * s, -L); cols.push(c.r, c.g, c.b, 0, 0, 0); }
        const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        g.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors: true, opacity: 0.45, ...add })));
      } else if (kind === 'dots') { // scia di puntini che rimpiccioliscono e si spengono
        const pos = [], cols = [], n = 26;
        for (let k = 0; k < 40; k++) { const x = (Math.random() - 0.5) * s, y = (Math.random() - 0.5) * s;
          for (let i = 0; i < n; i++) { const f = i / n; pos.push(x, y, -L * f); cols.push(c.r * (1 - f) * 0.7, c.g * (1 - f) * 0.7, c.b * (1 - f) * 0.7); } }
        const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
        g.add(new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.045, map: dotSprite, vertexColors: true, ...add })));
      } else { // foto: la faccia ripetuta all'indietro, sempre più fioca (lunga esposizione)
        const n = 18, plane = new THREE.PlaneGeometry(s * 0.96, s * 0.96);
        for (let i = 1; i <= n; i++) { const f = i / n;
          const m = new THREE.Mesh(plane, new THREE.MeshBasicMaterial({ map, color: c, opacity: (1 - f) * 0.1, ...add })); m.position.z = -L * f; g.add(m); }
      }
    }
    return { g, face, reg, s };
  });

  // grana della pellicola, fissa sopra la scena
  { const q = document.getElementById('grain').getContext('2d'), d = q.createImageData(W, H);
    for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 14; } q.putImageData(d, 0, 0); }

  // mouse: la camera si sposta (parallasse vera) e i riquadri vicini al puntatore si ingrandiscono e vengono avanti
  const mouse = { x: W / 2, y: H / 2, in: false }, aim = new THREE.Vector2(), v = new THREE.Vector3();
  addEventListener('mousemove', (e) => { const r = R.domElement.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.in = true; });
  let lastHot;
  function frame() {
    requestAnimationFrame(frame);
    aim.set(mouse.in ? (mouse.x / W - 0.5) * 1.6 : 0, mouse.in ? -(mouse.y / H - 0.5) * 1.0 : 0);
    let moving = redraw || Math.abs(aim.x - cam.position.x) + Math.abs(aim.y - cam.position.y) > 0.002;
    cam.position.x += (aim.x - cam.position.x) * 0.06; cam.position.y += (aim.y - cam.position.y) * 0.06; cam.lookAt(0, 0, -20);
    let hot = null, hotD = 1e9;
    for (const t of tiles) {
      v.copy(t.g.position).project(cam); const sx = (v.x + 1) / 2 * W, sy = (1 - v.y) / 2 * H, d = Math.hypot(sx - mouse.x, sy - mouse.y);
      const z = mouse.in ? 1 + Math.max(0, 1 - d / 220) * 0.8 : 1; // lente
      if (Math.abs(z - t.g.scale.x) > 0.002) { moving = true; t.g.scale.setScalar(t.g.scale.x + (z - t.g.scale.x) * 0.12); t.g.position.z = -Z0 + (t.g.scale.x - 1) * 0.6; }
      if (t.reg && d < hotD && d < t.s / K * t.g.scale.x) { hotD = d; hot = t.reg; }
    }
    if (hot !== lastHot) { lastHot = hot; card.innerHTML = hot ? `<h2>${hot[1]}</h2>${hot[2]}` : 'SALA RADAR · REGISTRO'; }
    if (!moving) return; // scena ferma: niente da ridisegnare
    redraw = false; composer.render();
  }
  frame();
</script>
</body>
</html>
